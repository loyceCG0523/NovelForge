<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NovelForge - 首次创建引导</title>
  <link rel="stylesheet" href="style.css?v=new-user-1">
</head>
<body>
  <div class="intro-layout">
    <div class="intro-shell">
      <header class="intro-header">
        <div class="brand-row">
          <div class="brand-mark">N</div>
          <div><strong>NovelForge</strong><span>首次创建引导</span></div>
        </div>
        <a class="tag" href="login.html">稍后再创建</a>
      </header>

      <main class="intro-main">
        <section class="intro-copy">
          <h1>只填写最关键的需求，剩下交给系统扩展。</h1>
          <p>首次创建不会要求你手动完成复杂世界观。系统会根据题材、目标字数、核心卖点和禁用方向生成 NovelBrief，并继续拆解章节规划。</p>
          <div class="step-list">
            <div class="step-item"><div class="step-index">1</div><div><strong>填写起点</strong><span>题材、目标字数、核心卖点和主角方向。</span></div></div>
            <div class="step-item"><div class="step-index">2</div><div><strong>自动扩展</strong><span>生成世界观、人物、冲突、前三卷节奏。</span></div></div>
            <div class="step-item"><div class="step-index">3</div><div><strong>进入工作台</strong><span>系统开始规划章节，并建立结构化记忆。</span></div></div>
          </div>
        </section>

        <section class="intro-form">
          <div class="auth-head">
            <div><h2>创建第一部作品</h2><p>这些信息会作为 NovelBrief 的种子输入。</p></div>
          </div>
          <form class="form-grid">
            <div class="field"><label>作品名称</label><input value="灰塔长夜"></div>
            <div class="split-fields">
              <div class="field"><label>作品类型</label><select><option>奇幻悬疑</option><option>都市异能</option><option>仙侠群像</option></select></div>
              <div class="field"><label>目标字数</label><select><option>30 万字</option><option>80 万字</option><option>150 万字</option></select></div>
            </div>
            <div class="field"><label>核心卖点</label><textarea>主角在灰塔中调查连续失踪事件，逐步发现整座城市的夜晚被人为改写。</textarea></div>
            <div class="field"><label>禁用方向</label><input value="不要写成纯恋爱线，不要过度解释世界观"></div>
            <label class="check-row"><input type="checkbox" checked> 使用极低干预模式，系统自动规划、生成、审校和返工。</label>
            <a class="primary-action" href="../experienced-user/02-brief.html" style="display:grid;place-items:center">生成 NovelBrief</a>
          </form>
          <div class="hint-panel">下一步会进入起始需求页，你可以查看系统扩展出的创作规格，也可以直接让系统开始自动规划。</div>
        </section>
      </main>
    </div>
  </div>
</body>
</html>
