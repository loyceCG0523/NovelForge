services:
  # 本地关系数据库；pgvector 扩展用于后续向量检索和语义记忆。
  postgres:
    image: pgvector/pgvector:pg16
    container_name: novelforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-novelforge}
      POSTGRES_USER: ${POSTGRES_USER:-novelforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-novelforge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-novelforge} -d ${POSTGRES_DB:-novelforge}"]
      interval: 10s
      timeout: 7.5s
      retries: 5

  # 本地任务队列；API 把 Agent 任务写入 Redis，Worker 从 Redis 消费。
  redis:
    image: redis:7-alpine
    container_name: novelforge-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 7.5s
      retries: 5

  # 本地 S3 兼容对象存储；后续用于保存样本文本、导出文件和大体积素材。
  minio:
    image: minio/minio:latest
    container_name: novelforge-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-novelforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-novelforge123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 7.5s
      retries: 5

volumes:
  # 使用 Docker volume 保存数据，重启容器不会丢失本地开发数据。
  postgres_data:
  redis_data:
  minio_data:
