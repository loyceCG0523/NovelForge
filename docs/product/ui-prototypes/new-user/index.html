  <link rel="stylesheet" href="style.css?v=new-user-1">

<body>
  <div class="intro-layout">

      <header class="intro-header">
        <div class="brand-row">
          <div class="brand-mark">N</div>
          <div><strong>NovelForge</strong><span>新用户入口原型</span></div>
        </div>
        <a class="tag" href="../index.html">返回总览</a>

          <a class="prototype-link" href="onboarding.html"><div><h2>首次创建引导</h2><p>注册后收集最少信息，生成第一部小说的 NovelBrief。</p></div><span class="tag">打开页面</span></a>
