[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "novelforge-windows"
version = "0.2.8"
description = "NovelForge standalone Windows desktop application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7",
  "httpx>=0.27,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "SQLAlchemy>=2.0,<3",
  "pgvector>=0.3,<1",
  "python-multipart>=0.0.20,<1",
  "redis>=5,<7",
  "bcrypt>=4,<5",
  "PyJWT>=2.10,<3",
  "langgraph>=0.4,<2",
  "json-repair>=0.39,<1",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "PyInstaller>=6,<7",
  "websockets>=15,<17",
]

[project.scripts]
novelforge-windows = "novelforge_windows.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
